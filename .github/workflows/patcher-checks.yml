name: Patcher checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'capstone>=5,<6'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile verified_patcher.py streamlit_app.py tools/reverse_report.py
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx tsx --test tests/patcher.test.ts
      - run: npm run build
